<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Avaliação Jujutsu High</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page-container">
        <div class="jujutsu-card">
            
            <div class="card-header">
                <div class="logo-area">
                    <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="45" />
                        <path d="M50 5 a 45 45 0 1 1 0 90 A 45 45 0 1 1 50 5 Z" stroke-dasharray="10 20" />
                        <path d="M50 50 m -10 -10 a 20 20 0 0 1 20 20 a 20 20 0 0 1 -20 20" />
                    </svg>
                    <span class="school-name">ESCOLA DE TÓQUIO PREFEITURAL JUJUTSU</span>
                </div>
                <h1 class="report-title">RELATÓRIO DE GRAU DO ALUNO</h1>
            </div>
            
            <div class="card-body">
                <div class="input-group">
                    <label class="input-label" for="nota1">Domínio de Combate (Nota 1)</label>
                    <input type="number" id="nota1" placeholder="Ex: 8.5" step="0.1" min="0" max="10">
                </div>
                
                <div class="input-group">
                    <label class="input-label" for="nota2">Potencial de Energia Amaldiçoada (Nota 2)</label>
                    <input type="number" id="nota2" placeholder="Ex: 7.0" step="0.1" min="0" max="10">
                </div>
                
                <div class="input-group">
                    <label class="input-label" for="nota3">Técnica Inata e Estratégia (Nota 3)</label>
                    <input type="number" id="nota3" placeholder="Ex: 9.1" step="0.1" min="0" max="10">
                </div>
                
                <button class="calc-button" onclick="calcularMedia()">ANALISAR POTENCIAL</button>
                
                <div id="result">
                    <p class="average-text">Média do Aluno:</p>
                    <p class="average-value" id="averageValue">--</p>
                    <div class="status-box" id="statusBox">--</div>
                    <p class="result-message" id="resultMessage"></p>
                </div>
            </div>

        </div>
    </div>

    <div id="animation-reprovado" class="animation-overlay hidden">
        <div class="animation-content anim-gojo">
            <img src="gojo.png" alt="Gojo" class="character-img gojo-img">
            <p class="character-quote gojo-quote">Você é Fraco.</p>
            <button class="close-btn" onclick="fecharAnimacoes()">Continuar Treinando</button>
        </div>
    </div>

    <div id="animation-aprovado" class="animation-overlay hidden">
        <div class="animation-content anim-sukuna">
            <img src="sukuna.png" alt="Sukuna" class="character-img sukuna-img">
            <p class="character-quote sukuna-quote">Tenha orgulho. Você é forte.</p>
            <button class="close-btn" onclick="fecharAnimacoes()">Aprimorar Técnica</button>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
